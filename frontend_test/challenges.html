<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Челленджи - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Friends 2.0</h1>
        <nav>
            <a href="friends.html">Друзья</a>
            <a href="friend-requests.html">Заявки</a>
            <a href="challenges.html">Челленджи</a>
            <div class="test-buttons">
                <button id="login-as-user1" class="btn btn-test btn-test-user1">User1</button>
                <button id="login-as-user2" class="btn btn-test btn-test-user2">User2</button>
            </div>
            <button id="logout-btn" class="btn btn-danger">Выйти</button>
        </nav>
    </div>

    <div class="page">
        <div class="section">
            <h2>Мои челленджи</h2>
            <a href="create-challenge.html" class="btn">Создать челлендж</a>
        </div>

        <div class="section">
            <h3>Фильтры</h3>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div class="form-group" style="margin-bottom: 0;">
                    <select id="friendship-filter">
                        <option value="">Все друзья</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <select id="status-filter">
                        <option value="">Все статусы</option>
                        <option value="pending">Ожидают принятия</option>
                        <option value="accepted">Принятые</option>
                        <option value="completed">На проверке</option>
                        <option value="approved">Завершенные</option>
                        <option value="rejected">Отклоненные</option>
                    </select>
                </div>
                <button id="apply-filters" class="btn">Применить</button>
            </div>
        </div>

        <div class="section">
            <h3>Список челленджей</h3>
            <div id="challenges-list">
                <div class="loading">Загрузка челленджей...</div>
            </div>
        </div>
    </div>

    <div id="notifications"></div>

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="js/tokenManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/challenges.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const challenges = new Challenges();
            const auth = new Auth();
            
            // Проверяем авторизацию
            const isAuthenticated = await auth.checkAuth();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Настраиваем кнопку выхода
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.logout();
            });

            // Кнопки быстрого входа
            document.getElementById('login-as-user1').addEventListener('click', async () => {
                const success = await auth.quickLogin('user1@test.com', 'password123');
                if (success) {
                    window.location.reload();
                }
            });

            document.getElementById('login-as-user2').addEventListener('click', async () => {
                const success = await auth.quickLogin('user2@test.com', 'password123');
                if (success) {
                    window.location.reload();
                }
            });

            // Загружаем друзей для фильтра
            await challenges.loadFriendsForFilter();

            // Загружаем список челленджей
            await challenges.loadChallenges();

            // Обработка фильтров
            document.getElementById('apply-filters').addEventListener('click', async () => {
                const friendshipId = document.getElementById('friendship-filter').value;
                const status = document.getElementById('status-filter').value;
                await challenges.loadChallenges(friendshipId, status);
            });
        });
    </script>
</body>
</html>
