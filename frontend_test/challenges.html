<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Челленджи - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Friends 2.0</h1>
        <nav>
            <a href="friends.html">Друзья</a>
            <a href="friend-requests.html">Заявки <span id="requests-counter" class="notification-badge" style="display: none;">0</span></a>
            <a href="challenges.html">Челленджи</a>
            <a href="profile.html">Профиль</a>
            <a href="users.html" id="users-link">Все пользователи</a>
            <a href="admin.html" id="admin-link" class="admin-nav-link" style="display: none;">Админка</a>
        </nav>
        <button id="logout-btn" class="btn btn-danger logout-btn">Выйти</button>
    </div>

    <div class="page">
        <div class="section">
            <h2>Мои челленджи</h2>
            <a href="create-challenge.html" class="btn">Создать челлендж</a>
        </div>

        <div class="section">
            <h3>Фильтры</h3>
            <div class="filter-section">
                <div class="form-group">
                    <select id="friendship-filter">
                        <option value="">Все друзья</option>
                    </select>
                </div>
                <div class="form-group">
                    <select id="status-filter">
                        <option value="">Все статусы</option>
                        <option value="pending">Ожидают принятия</option>
                        <option value="accepted">Принятые</option>
                        <option value="completed">На проверке</option>
                        <option value="approved">Завершенные</option>
                        <option value="rejected">Отклоненные</option>
                    </select>
                </div>
                <button id="apply-filters" class="btn">Применить</button>
            </div>
        </div>

        <div class="section">
            <h3>Список челленджей</h3>
            <div id="challenges-list">
                <div class="loading">Загрузка челленджей...</div>
            </div>
        </div>
    </div>

    <div id="notifications"></div>

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="js/tokenManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/challenges.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const challenges = new Challenges();
            const auth = new Auth();
            
            // Проверяем авторизацию
            const isAuthenticated = await auth.checkAuth();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Настраиваем кнопку выхода
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.logout();
            });

            // Загружаем друзей для фильтра
            await challenges.loadFriendsForFilter();

            // Загружаем список челленджей
            await challenges.loadChallenges();

            // Обработка фильтров
            document.getElementById('apply-filters').addEventListener('click', async () => {
                const friendshipId = document.getElementById('friendship-filter').value;
                const status = document.getElementById('status-filter').value;
                await challenges.loadChallenges(friendshipId, status);
            });
        });
        const user = window.tokenManager.getUser();
        if (user && user.role === 'admin') {
            const adminLink = document.getElementById('admin-link');
            if (adminLink) {
                adminLink.style.display = 'inline';
            }
        }
    </script>
</body>
</html>
