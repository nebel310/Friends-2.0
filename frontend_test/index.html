<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends 2.0</title>
    

</head>
<body>
    <div id="loading">Загрузка...</div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loading = document.getElementById('loading');
            
            // Создаем экземпляр Auth для инициализации
            const auth = new Auth();
            
            // Инициализируем авторизацию (получаем access токен если есть refresh)
            const hasValidToken = await auth.init();
            
            if (hasValidToken) {
                // Дополнительно проверяем валидность токена
                const isValid = await auth.checkAuth();
                if (isValid) {
                    window.location.href = 'friends.html';
                } else {
                    window.location.href = 'login.html';
                }
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
    <script src="./js/tokenManager.js" defer></script>
    <script src="./js/ui.js" defer></script>
    <script src="./js/api.js" defer></script>
    <script src="./js/auth.js" defer></script>
</html>
