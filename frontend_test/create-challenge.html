<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать челлендж - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Friends 2.0</h1>
        <nav>
            <a href="friends.html">Друзья</a>
            <a href="friend-requests.html">Заявки <span id="requests-counter" class="notification-badge" style="display: none;">0</span></a>
            <a href="challenges.html">Челленджи</a>
        </nav>
        <button id="logout-btn" class="btn btn-danger logout-btn">Выйти</button>
    </div>

    <div class="page">
        <div class="section">
            <h2>Создать челлендж</h2>
            
            <form id="create-challenge-form" class="create-challenge-form">
                <div class="form-group">
                    <label for="friendship">Выберите друга:</label>
                    <select id="friendship" name="friendship" required>
                        <option value="">-- Выберите друга --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="title">Название челленджа:</label>
                    <input type="text" id="title" name="title" required maxlength="100" placeholder="Введите название">
                </div>

                <div class="form-group">
                    <label for="description">Описание (необязательно):</label>
                    <textarea id="description" name="description" rows="4" placeholder="Опишите задание"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Создать челлендж</button>
                    <a href="challenges.html" class="btn btn-danger">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <div id="notifications"></div>

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="js/tokenManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/challenges.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const challenges = new Challenges();
            const auth = new Auth();
            
            // Проверяем авторизацию
            const isAuthenticated = await auth.checkAuth();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Настраиваем кнопку выхода
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.logout();
            });

            // Загружаем список друзей для выбора
            await challenges.loadFriendsForChallengeCreation();

            // Обработка формы создания челленджа
            document.getElementById('create-challenge-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const friendshipId = parseInt(formData.get('friendship'));
                const title = formData.get('title');
                const description = formData.get('description');

                const success = await challenges.createChallenge(friendshipId, title, description);
                if (success) {
                    window.location.href = 'challenges.html';
                }
            });
        });
    </script>
</body>
</html>
