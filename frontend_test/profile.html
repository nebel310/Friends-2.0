<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Friends 2.0</h1>
        <nav>
            <a href="friends.html">Друзья</a>
            <a href="friend-requests.html">Заявки <span id="requests-counter" class="notification-badge" style="display: none;">0</span></a>
            <a href="challenges.html">Челленджи</a>
            <a href="profile.html" id="profile-link">Профиль</a>
            <a href="users.html" id="users-link">Все пользователи</a>
            <a href="admin.html" id="admin-link" class="admin-nav-link" style="display: none;">Админка</a>
        </nav>
        <button id="logout-btn" class="btn btn-danger logout-btn">Выйти</button>
    </div>

    <div class="page">
        <div class="section">
            <h2>Мой профиль</h2>
            
            <div id="profile-status">
                <div class="loading">Загрузка профиля...</div>
            </div>

            <div id="profile-content" style="display: none;">
                <div class="profile-sections">
                    <div class="section">
                        <h3>Аватар</h3>
                        <div id="avatar-container"></div>
                    </div>

                    <div class="section">
                        <h3>Основная информация</h3>
                        <form id="profile-form">
                            <div class="form-group">
                                <label for="username">Имя пользователя:</label>
                                <input type="text" id="username" name="username" required minlength="3" maxlength="50">
                            </div>

                            <div class="form-group">
                                <label for="email">Email:</label>
                                <input type="email" id="email" name="email" required>
                                <div id="email-status" style="margin-top: 0.5rem; font-size: 0.9rem;"></div>
                            </div>

                            <div class="form-group">
                                <label for="gender">Пол:</label>
                                <select id="gender" name="gender">
                                    <option value="">Не указан</option>
                                    <option value="male">Мужской</option>
                                    <option value="female">Женский</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="bio">О себе:</label>
                                <textarea id="bio" name="bio" rows="3" maxlength="500" placeholder="Расскажите о себе..."></textarea>
                            </div>

                            <div class="form-group">
                                <label for="birth_date">Дата рождения:</label>
                                <input type="date" id="birth_date" name="birth_date">
                            </div>

                            <div class="form-group">
                                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                                    <input type="checkbox" id="is_visible" name="is_visible" style="width: auto;">
                                    <span>Профиль видим для других пользователей</span>
                                </label>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn">Сохранить изменения</button>
                            </div>
                        </form>
                    </div>

                    <div class="section">
                        <h3>Смена пароля</h3>
                        <form id="password-form">
                            <div class="form-group">
                                <label for="current_password">Текущий пароль:</label>
                                <input type="password" id="current_password" name="current_password" required>
                            </div>

                            <div class="form-group">
                                <label for="new_password">Новый пароль:</label>
                                <input type="password" id="new_password" name="new_password" required minlength="6">
                            </div>

                            <div class="form-group">
                                <label for="new_password_confirm">Подтверждение нового пароля:</label>
                                <input type="password" id="new_password_confirm" name="new_password_confirm" required minlength="6">
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn">Сменить пароль</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="notifications"></div>

    <script src="js/tokenManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Помечаем активную ссылку
            document.getElementById('profile-link').classList.add('active');
            
            const auth = new Auth();
            
            // Проверяем авторизацию
            const isAuthenticated = await auth.checkAuth();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Создаем Profile ПОСЛЕ проверки авторизации
            const profile = new Profile();
            
            // Настраиваем кнопку выхода
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.logout();
            });

            // Загружаем профиль
            await profile.loadProfile();
        });
        const user = window.tokenManager.getUser();
        if (user && user.role === 'admin') {
            const adminLink = document.getElementById('admin-link');
            if (adminLink) {
                adminLink.style.display = 'inline';
            }
        }
    </script>
</body>
</html>
