<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Друзья - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1><a href="landing.html" style="text-decoration: none; color: inherit;">Friends 2.0</a></h1>
        <nav>
            <a href="friends.html">Друзья</a>
            <a href="friend-requests.html">Заявки <span id="requests-counter" class="notification-badge" style="display: none;">0</span></a>
            <a href="challenges.html">Челленджи</a>
            <a href="profile.html">Профиль</a>
            <a href="users.html" id="users-link">Все пользователи</a>
            <a href="admin.html" id="admin-link" class="admin-nav-link" style="display: none;">Админка</a>
        </nav>
        <button id="logout-btn" class="btn btn-danger logout-btn">Выйти</button>
    </div>

    <div class="page">
        <h2>Мои друзья</h2>
        
        <div class="section">
            <h3>Добавить друга</h3>
            <form id="add-friend-form">
                <div class="form-group">
                    <input type="text" id="friend-username" placeholder="Имя пользователя или email" required>
                </div>
                <button type="submit" class="btn">Отправить заявку</button>
            </form>
        </div>

        <div class="section">
            <h3>Список друзей</h3>
            <div id="friends-list">
                <div class="loading">Загрузка друзей...</div>
            </div>
        </div>
    </div>

    <div id="notifications"></div>

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="js/tokenManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/friends.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const auth = new Auth();
            
            // Инициализируем авторизацию
            await auth.init();
            
            // Проверяем авторизацию
            const isAuthenticated = await auth.checkAuth();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Настраиваем кнопку выхода
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.logout();
            });

            // Загружаем список друзей
            const friends = new Friends();
            await friends.loadFriendsList();

            // Загружаем счетчик заявок
            await friends.updateRequestsCounter();

            // Обработка формы добавления друга
            document.getElementById('add-friend-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('friend-username').value;
                await friends.sendFriendRequest(username);
                document.getElementById('friend-username').value = '';
            });
            
            // Проверяем роль пользователя и показываем ссылку на админку если он администратор
            const user = window.tokenManager.getUser();
            if (user && user.role === 'admin') {
                const adminLink = document.getElementById('admin-link');
                if (adminLink) {
                    adminLink.style.display = 'inline';
                }
            }
        });
    </script>
    <script src="js/avatar-viewer.js"></script>
    <div class="mobile-nav">
        <div class="mobile-nav-container">
            <a href="friends.html" class="mobile-nav-item">
                <i class="fas fa-users mobile-nav-icon"></i>
                <span class="mobile-nav-text">Друзья</span>
            </a>
            <a href="friend-requests.html" class="mobile-nav-item">
                <i class="fas fa-user-plus mobile-nav-icon"></i>
                <span class="mobile-nav-text">Заявки</span>
                <span id="mobile-requests-counter" class="mobile-notification-badge" style="display: none;">0</span>
            </a>
            <a href="challenges.html" class="mobile-nav-item">
                <i class="fas fa-tasks mobile-nav-icon"></i>
                <span class="mobile-nav-text">Челленджи</span>
            </a>
            <a href="profile.html" class="mobile-nav-item">
                <i class="fas fa-user mobile-nav-icon"></i>
                <span class="mobile-nav-text">Профиль</span>
            </a>
            <a href="users.html" class="mobile-nav-item">
                <i class="fas fa-search mobile-nav-icon"></i>
                <span class="mobile-nav-text">Поиск</span>
            </a>
            <!-- Для админов -->
            <a href="admin.html" class="mobile-nav-item admin-nav-link" id="mobile-admin-link" style="display: none;">
                <i class="fas fa-cog mobile-nav-icon"></i>
                <span class="mobile-nav-text">Админ</span>
            </a>
        </div>
    </div>
</body>
</html>
