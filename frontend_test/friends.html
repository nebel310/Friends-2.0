<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Друзья - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Friends 2.0</h1>
        <nav>
            <a href="friends.html">Друзья</a>
            <a href="friend-requests.html">Заявки</a>
            <a href="challenges.html">Челленджи</a>
            <div class="test-buttons">
                <button id="login-as-user1" class="btn btn-test btn-test-user1">User1</button>
                <button id="login-as-user2" class="btn btn-test btn-test-user2">User2</button>
            </div>
            <button id="logout-btn" class="btn btn-danger">Выйти</button>
        </nav>
    </div>

    <div class="page">
        <h2>Мои друзья</h2>
        
        <div class="section">
            <h3>Добавить друга</h3>
            <form id="add-friend-form">
                <div class="form-group">
                    <input type="text" id="friend-username" placeholder="Имя пользователя или email" required>
                </div>
                <button type="submit" class="btn">Отправить заявку</button>
            </form>
        </div>

        <div class="section">
            <h3>Список друзей</h3>
            <div id="friends-list">
                <div class="loading">Загрузка друзей...</div>
            </div>
        </div>
    </div>

    <div id="notifications"></div>

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="js/tokenManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/friends.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const friends = new Friends();
            const auth = new Auth();
            
            // Проверяем авторизацию
            const isAuthenticated = await auth.checkAuth();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Настраиваем кнопку выхода
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.logout();
            });

            // Кнопки быстрого входа
            document.getElementById('login-as-user1').addEventListener('click', async () => {
                const success = await auth.quickLogin('user1@test.com', 'password123');
                if (success) {
                    window.location.reload();
                }
            });

            document.getElementById('login-as-user2').addEventListener('click', async () => {
                const success = await auth.quickLogin('user2@test.com', 'password123');
                if (success) {
                    window.location.reload();
                }
            });

            // Загружаем список друзей
            await friends.loadFriendsList();

            // Обработка формы добавления друга
            document.getElementById('add-friend-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('friend-username').value;
                await friends.sendFriendRequest(username);
                document.getElementById('friend-username').value = '';
            });
        });
    </script>
</body>
</html>
