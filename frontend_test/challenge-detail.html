<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали челленджа - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Friends 2.0</h1>
        <nav>
            <a href="friends.html">Друзья</a>
            <a href="friend-requests.html">Заявки</a>
            <a href="challenges.html">Челленджи</a>
            <div class="test-buttons">
                <button id="login-as-user1" class="btn btn-test btn-test-user1">User1</button>
                <button id="login-as-user2" class="btn btn-test btn-test-user2">User2</button>
            </div>
            <button id="logout-btn" class="btn btn-danger">Выйти</button>
        </nav>
    </div>

    <div class="page">
        <div id="challenge-detail">
            <div class="loading">Загрузка деталей челленджа...</div>
        </div>
    </div>

    <div id="notifications"></div>

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="js/tokenManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/challenges.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const challenges = new Challenges();
            const auth = new Auth();
            
            // Проверяем авторизацию
            const isAuthenticated = await auth.checkAuth();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Настраиваем кнопку выхода
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.logout();
            });

            // Кнопки быстрого входа
            document.getElementById('login-as-user1').addEventListener('click', async () => {
                const success = await auth.quickLogin('user1@test.com', 'password123');
                if (success) {
                    window.location.reload();
                }
            });

            document.getElementById('login-as-user2').addEventListener('click', async () => {
                const success = await auth.quickLogin('user2@test.com', 'password123');
                if (success) {
                    window.location.reload();
                }
            });

            // Получаем ID челленджа из URL
            const urlParams = new URLSearchParams(window.location.search);
            const challengeId = urlParams.get('id');

            if (!challengeId) {
                window.location.href = 'challenges.html';
                return;
            }

            // Загружаем детали челленджа
            await challenges.loadChallengeDetail(challengeId);
        });
    </script>
</body>
</html>
