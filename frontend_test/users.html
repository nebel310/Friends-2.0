<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Friends 2.0</h1>
        <nav>
            <a href="friends.html">Друзья</a>
            <a href="friend-requests.html">Заявки <span id="requests-counter" class="notification-badge" style="display: none;">0</span></a>
            <a href="challenges.html">Челленджи</a>
            <a href="profile.html">Профиль</a>
            <a href="users.html" id="users-link">Все пользователи</a>
            <a href="admin.html" id="admin-link" class="admin-nav-link" style="display: none;">Админка</a>
        </nav>
        <button id="logout-btn" class="btn btn-danger logout-btn">Выйти</button>
    </div>

    <div class="page">
        <div class="section">
            <h2>Поиск пользователей</h2>
            
            <div class="filter-section">
                <div class="form-group">
                    <input type="text" id="search-input" placeholder="Поиск по имени или описанию...">
                </div>
                <div class="form-group">
                    <select id="gender-filter">
                        <option value="">Все</option>
                        <option value="male">Мужчины</option>
                        <option value="female">Женщины</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="min-age" placeholder="Мин. возраст" min="0" max="150">
                </div>
                <div class="form-group">
                    <input type="number" id="max-age" placeholder="Макс. возраст" min="0" max="150">
                </div>
                <button id="apply-filters" class="btn">Применить</button>
                <button id="reset-filters" class="btn btn-danger">Сбросить</button>
            </div>
            
            <div id="stats-container" style="margin-top: 1rem; display: none;">
                <div class="stats-grid" id="stats-grid"></div>
            </div>
        </div>

        <div class="section">
            <h3>Пользователи</h3>
            <div id="users-list">
                <div class="loading">Загрузка пользователей...</div>
            </div>
            <div id="loading-more" style="display: none; text-align: center; padding: 1rem;">
                <div class="loading">Загрузка...</div>
            </div>
            <div id="no-more-results" style="display: none; text-align: center; padding: 1rem; color: var(--text-muted);">
                Все пользователи загружены
            </div>
        </div>
    </div>

    <!-- Модальное окно для детальной информации о пользователе -->
    <div id="user-detail-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 500px;">
            <button class="modal-close">&times;</button>
            <div id="user-detail-content">
                <!-- Здесь будет детальная информация -->
            </div>
        </div>
    </div>

    <div id="notifications"></div>

    <!-- Подключаем скрипты -->
    <script src="js/tokenManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/friends.js"></script>
    <script src="js/users.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const auth = new Auth();
            
            // Проверяем авторизацию
            const isAuthenticated = await auth.checkAuth();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Помечаем активную ссылку
            document.getElementById('users-link').classList.add('active');

            // Проверяем роль пользователя и показываем ссылку на админку если он администратор
            const user = window.tokenManager.getUser();
            if (user && user.role === 'admin') {
                const adminLink = document.getElementById('admin-link');
                if (adminLink) {
                    adminLink.style.display = 'inline';
                }
            }

            // Настраиваем кнопку выхода
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.logout();
            });

            // Инициализируем страницу пользователей
            const usersPage = new UsersPage();
            window.usersPage = usersPage;
            await usersPage.init();
        });
    </script>
</body>
</html>
