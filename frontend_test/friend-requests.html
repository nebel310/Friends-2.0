<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки в друзья - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1>Friends 2.0</h1>
        <nav>
            <a href="friends.html">Друзья</a>
            <a href="friend-requests.html">Заявки</a>
            <a href="challenges.html">Челленджи</a>
            <button id="logout-btn" class="btn btn-danger">Выйти</button>
        </nav>
    </div>

    <div class="page">
        <h2>Заявки в друзья</h2>
        
        <div class="section">
            <h3>Входящие заявки</h3>
            <div id="incoming-requests">
                <div class="loading">Загрузка заявок...</div>
            </div>
        </div>
    </div>

    <div id="notifications"></div>

    <script type="module">
        import Friends from './js/friends.js';
        import Auth from './js/auth.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            const friends = new Friends();
            const auth = new Auth();
            
            // Проверяем авторизацию
            const isAuthenticated = await auth.checkAuth();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Настраиваем кнопку выхода
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.logout();
            });

            // Загружаем заявки
            await friends.loadFriendRequests();
        });
    </script>
</body>
</html>
