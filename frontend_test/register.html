<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Friends 2.0</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-form">
        <h2>Регистрация</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="password-confirm">Подтверждение пароля:</label>
                <input type="password" id="password-confirm" name="password-confirm" required>
            </div>
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
        <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>

    <div id="notifications"></div>

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="js/tokenManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const auth = new Auth();
            
            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const username = formData.get('username');
                const email = formData.get('email');
                const password = formData.get('password');
                const passwordConfirm = formData.get('password-confirm');

                if (password !== passwordConfirm) {
                    auth.ui.showNotification('Пароли не совпадают', 'error');
                    return;
                }

                const success = await auth.register(username, email, password, passwordConfirm);
                if (success) {
                    window.location.href = 'login.html';
                }
            });
        });
    </script>
</body>
</html>
